name: tests

# The repo's first test workflow (issue #149). Before this, nothing ran the
# suite on push — and nothing at all ran it against Postgres, which is what
# production (Supabase) actually is.
#
# Two legs, both required to be green:
#   postgres — the engine we ship on. The one that matters.
#   sqlite   — the fallback config.py defaults to, which cli.py and the
#              no-Docker contributor path depend on. Kept so that path cannot
#              silently break.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.engine }})
    runs-on: ubuntu-latest

    strategy:
      # Never let one leg's failure hide the other's — the whole point is to
      # see the two engines diverge.
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            test_database_url: postgresql://art:art@localhost:5432/art
          - engine: sqlite
            # Empty, not absent: conftest coerces "" to None, selecting SQLite.
            test_database_url: ""

    services:
      # Runs for both legs; the sqlite leg simply ignores it. Cheaper than
      # duplicating the whole job to make the service conditional.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: art
          POSTGRES_PASSWORD: art
          POSTGRES_DB: art
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U art -d art"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile (python:3.12-slim), so CI runs the
          # interpreter production runs.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements-core.txt, not the lock: the heavy extras (torch,
        # docling, sentence-transformers) are lazily imported behind graceful
        # fallbacks that tests/test_deps_split.py pins, so CI does not need to
        # pull ~1GB of wheels to exercise them.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install pytest==9.0.3

      - name: Run tests
        env:
          ART_TEST_DATABASE_URL: ${{ matrix.test_database_url }}
        run: python run_tests.py
