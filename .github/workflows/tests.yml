name: tests

# The repo's first test workflow (issue #149). Before this, nothing ran the
# suite on push — and nothing at all ran it against Postgres, which is what
# production (Supabase) actually is.
#
# Two legs, both required to be green:
#   postgres — the engine we ship on. The one that matters.
#   sqlite   — the fallback config.py defaults to, which cli.py and the
#              no-Docker contributor path depend on. Kept so that path cannot
#              silently break.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lock:
    # The Dockerfile and the `art ui` build both run `npm ci`, which refuses a
    # package-lock.json that has drifted from package.json (#219). Check it
    # here so drift fails the PR instead of the deploy. Node 24 bundles npm 11,
    # the version the Dockerfile uses; npm 10 writes optional deps differently.
    name: frontend lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: npm ci accepts the lockfile
        working-directory: web/frontend
        run: npm ci --dry-run --ignore-scripts

  package:
    # The #194 acceptance test: build the wheel the way a release does (editor
    # first, so `art ui` ships), install it with no extras into a venv that
    # holds nothing else, and drive `art-mcp` over stdio as a host would. The
    # smoke script also fails if torch or an LLM client is importable.
    name: package (uvx art-mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build the editor
        run: |
          npm --prefix web/frontend ci
          npm --prefix web/frontend run build

      - name: Build the wheel
        run: uv build

      - name: The wheel ships the editor and no frontend sources
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "web/static/index.html" in names, "editor not shipped"
          assert not [n for n in names if n.startswith("web/frontend/")], "frontend sources shipped"
          assert not [n for n in names if n.startswith(("tests/", "eval/"))], "tests shipped"
          print(len(names), "files")
          EOF

      - name: Clean install, no extras, driven over MCP
        run: |
          uv venv /tmp/clean --python 3.12
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          cd /tmp
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/scripts/smoke_art_mcp.py"
          ART_DATA_DIR=/tmp/art-list /tmp/clean/bin/art --list > /dev/null

  test:
    name: tests (${{ matrix.engine }})
    runs-on: ubuntu-latest

    strategy:
      # Never let one leg's failure hide the other's — the whole point is to
      # see the two engines diverge.
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            test_database_url: postgresql://art:art@localhost:5433/art
          - engine: sqlite
            # Empty, not absent: conftest coerces "" to None, selecting SQLite.
            test_database_url: ""

    services:
      # Runs for both legs; the sqlite leg simply ignores it. Cheaper than
      # duplicating the whole job to make the service conditional.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: art
          POSTGRES_PASSWORD: art
          POSTGRES_DB: art
        ports:
          # 5433 on the host to match docker-compose.yml, so the DSN is the
          # same string locally and in CI. Nothing contends for 5432 on a
          # runner; the consistency is the point.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U art -d art"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile (python:3.12-slim), so CI runs the
          # interpreter production runs.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements-core.txt, not the lock: the heavy extras (torch,
        # docling, sentence-transformers) are lazily imported behind graceful
        # fallbacks that tests/test_deps_split.py pins, so CI does not need to
        # pull ~1GB of wheels to exercise them.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install pytest==9.0.3

      - name: Run tests
        env:
          ART_TEST_DATABASE_URL: ${{ matrix.test_database_url }}
        run: python run_tests.py
